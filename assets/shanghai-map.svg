<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="上海地铁线路示意图（装饰用，非实际地理比例）">
  <title>上海地铁线路示意图（装饰用 · 非实际地理比例）</title>

