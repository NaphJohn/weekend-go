    <circle cx="610" cy="186" r="4.5"/>
    <circle cx="440" cy="108" r="4.5"/>
    <circle cx="822" cy="108" r="4.5"/>
    <circle cx="430" cy="176" r="4.5"/>
    <circle cx="652" cy="140" r="4.5"/>
    <circle cx="652" cy="244" r="4.5"/>
    <circle cx="700" cy="162" r="4.5"/>
    <circle cx="800" cy="202" r="4.5"/>
    <circle cx="370" cy="162" r="4.5"/>
    <circle cx="300" cy="202" r="4.5"/>
    <circle cx="198" cy="100" r="4.5"/>
    <circle cx="762" cy="58"  r="4.5"/>
  </g>

  <!-- 区名标注 -->
  <g fill="#ffffff" fill-opacity=".52" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="600">
