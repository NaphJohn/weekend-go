  <path d="M228 118 C330 98 402 140 500 128 C542 122 572 134 600 150"
        fill="none" stroke="#8fd8ff" stroke-width="5" stroke-opacity=".18" stroke-linecap="round"/>

  <!-- 地铁线（拓扑示意，非地理比例） -->
