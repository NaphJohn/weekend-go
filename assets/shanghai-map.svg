    <path d="M520 6 L520 96 L610 186 L610 296"                        stroke="#E4002B" stroke-opacity=".55"/>
    <path d="M20 158 L338 158 L440 108 L822 108 L920 158 L1180 158"   stroke="#00A650" stroke-opacity=".55"/>
