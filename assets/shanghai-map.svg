    <path d="M118 88 L338 88 L430 176 L430 292"                       stroke="#F3641F" stroke-opacity=".50"/>
    <path d="M600 296 L652 244 L652 140 L762 58 L986 58"              stroke="#009EDB" stroke-opacity=".50"/>
    <path d="M58 252 L280 252 L370 162 L700 162 L800 252 L1016 252"   stroke="#79BCE8" stroke-opacity=".45"/>
    <path d="M700 16 L700 104 L800 202 L1062 202"                     stroke="#C2A5CF" stroke-opacity=".45"/>
  </g>

